[project]
name = "transcribe"
version = "0.1.0"
description = "Audio transcription and speaker diarization CLI tool using AssemblyAI"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Miguel Rios" }
]
dependencies = [
    "assemblyai>=0.17.0",
]

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
